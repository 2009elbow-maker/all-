<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
    <video class="login-background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="{{ url_for('static', filename='poke.mp4') }}" type="video/mp4">
    </video>
    <div class="login-video-overlay" aria-hidden="true"></div>

    <main class="login-box">
        <h1>Create Account</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p id="login-message" role="alert">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form id="auth-form" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" minlength="3" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>

            <button type="submit">Sign up</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('login') }}">Back to login</a></p>
    </main>
</body>
</html>
