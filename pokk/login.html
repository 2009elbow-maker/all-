<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Login</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-page">
    <video class="login-background-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="./poke.mp4" type="video/mp4">
    </video>
    <div class="login-video-overlay" aria-hidden="true"></div>

    <main class="login-box">
        <h1>Pokédex Login</h1>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Log in</button>
            <p id="login-message" role="alert" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginMessage = document.getElementById("login-message");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (username === "admin" && password === "root") {
                window.location.href = "./index.html";
                return;
            }

            loginMessage.textContent = "Incorrect username or password.";
            loginForm.reset();
            document.getElementById("username").focus();
        });
    </script>
</body>
</html>
